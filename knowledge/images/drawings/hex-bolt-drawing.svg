<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" font-family="Arial,sans-serif">
<rect width="420" height="220" fill="#fff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker></defs>
<g stroke="#222" stroke-width="2" fill="none">
  <!-- head -->
  <polygon points="70,70 90,55 130,55 150,70 150,95 130,110 90,110 70,95" fill="#f4f4f4"/>
  <line x1="90" y1="55" x2="90" y2="110"/><line x1="130" y1="55" x2="130" y2="110"/>
  <line x1="70" y1="70" x2="150" y2="70"/><line x1="70" y1="95" x2="150" y2="95"/>
  <!-- shank -->
  <rect x="150" y="75" width="90" height="30" fill="#fafafa"/>
  <!-- thread -->
  <rect x="240" y="75" width="120" height="30" fill="#fafafa"/>
  <g stroke="#555" stroke-width="1">
    <path d="M245,75 l10,30 M260,75 l10,30 M275,75 l10,30 M290,75 l10,30 M305,75 l10,30 M320,75 l10,30 M335,75 l10,30 M350,75 l10,30"/>
  </g>
  <line x1="360" y1="75" x2="375" y2="90" /><line x1="375" y1="90" x2="360" y2="105"/>
</g>
<!-- dimensions -->
<g stroke="#666" stroke-width="1" fill="#333" font-size="12">
  <line x1="70" y1="45" x2="150" y2="45" marker-start="url(#b)" marker-end="url(#a)"/>
  <text x="110" y="40" text-anchor="middle">s</text>
  <line x1="70" y1="50" x2="70" y2="68"/><line x1="150" y1="50" x2="150" y2="68"/>
  <line x1="60" y1="55" x2="60" y2="110" marker-start="url(#b)" marker-end="url(#a)"/>
  <text x="52" y="86" text-anchor="middle">k</text>
  <line x1="65" y1="55" x2="88" y2="55"/><line x1="65" y1="110" x2="88" y2="110"/>
  <line x1="150" y1="125" x2="360" y2="125" marker-start="url(#b)" marker-end="url(#a)"/>
  <text x="255" y="140" text-anchor="middle">l</text>
  <line x1="150" y1="107" x2="150" y2="130"/><line x1="360" y1="107" x2="360" y2="130"/>
  <line x1="240" y1="125" x2="240" y2="107" stroke-dasharray="3,2"/>
  <text x="300" y="155" text-anchor="middle">b (резьба)</text>
  <line x1="385" y1="75" x2="385" y2="105" marker-start="url(#b)" marker-end="url(#a)"/>
  <text x="398" y="94" text-anchor="middle">d</text>
  <line x1="362" y1="75" x2="390" y2="75"/><line x1="362" y1="105" x2="390" y2="105"/>
</g>
<text x="210" y="190" text-anchor="middle" font-size="13" fill="#444">Схема болта с шестигранной головкой: d — диаметр, l — длина, k — высота головки, s — размер под ключ</text>
</svg>